<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="katex.min.css">
  <script src="katex.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #f4efe6;
      font-family: "Fraunces", Georgia, serif;
      overflow: hidden;
    }
    body {
      padding: 10px 14px;
      border-radius: 12px;
    }
    #math {
      text-align: center;
      font-size: 20px;
      color: #1e1b15;
    }
    .katex-error {
      color: #b91c1c;
      font-family: monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="math"></div>
  <script>
    function renderMath(latex) {
      try {
        katex.render(latex, document.getElementById('math'), {
          throwOnError: false,
          displayMode: true,
          output: 'html',
          strict: 'ignore'
        });
      } catch (e) {
        var el = document.getElementById('math');
        el.className = 'katex-error';
        el.textContent = 'LaTeX-Fehler: ' + e.message;
      }
      return getContentHeight();
    }
    function getContentHeight() {
      return Math.max(40, document.body.scrollHeight + 4);
    }
  </script>
</body>
</html>
